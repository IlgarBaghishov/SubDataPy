name: SubDataPy CI

# Controls when the workflow will run
on:
  push:
    branches: [ main, master ] # Adjust if your default branch is named differently
  pull_request:
    branches: [ main, master ] # Adjust if your default branch is named differently

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Use a Linux runner
    strategy:
      fail-fast: false # Ensures all Python versions in the matrix are tested
      matrix:
        # Test against a range of relevant Python versions
        python-version: ["3.11", "3.12"]

    steps:
    # Step 1: Check out your repository code so the workflow can access it
    - name: Check out repository code
      uses: actions/checkout@v4

    # Step 2: Set up the specified Python version from the matrix
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # Step 3: Install dependencies
    # This step assumes you have pyproject.toml set up with your dependencies
    # and optional dependencies for testing (e.g., pytest, pytest-cov).
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install the package itself along with its test dependencies
        # This requires [project.optional-dependencies].test to be defined in pyproject.toml
        # with pytest, pytest-cov etc.
        pip install .[test]

    # Step 4: Run tests with pytest and generate coverage report
    - name: Run tests with pytest
      run: |
        # Run pytest, telling it to collect coverage for the 'subdatapy' package
        # The coverage report will be in XML format (useful for services like Codecov)
        # and also printed to the terminal (term-missing).
        pytest --cov=subdatapy --cov-report=term-missing --cov-report=xml

    # Optional Step 5: Upload coverage report to a service like Codecov
    # - name: Upload coverage to Codecov
    #   uses: codecov/codecov-action@v4
    #   with:
    #     token: ${{ secrets.CODECOV_TOKEN }} # Store your Codecov token in GitHub secrets
    #     files: ./coverage.xml # Path to the coverage report file
    #     flags: unittests
    #     name: codecov-umbrella
    #     fail_ci_if_error: true