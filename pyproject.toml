[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
# backend-path = ["."] # Optional: often not needed if setuptools is just imported

[project]
name = "SubDataPy"
version = "0.1.0"
description = "A Python toolkit for subsampling large datasets for Machine Learning Interatomic Potentials."
readme = "README.md"
requires-python = ">=3.8" # Common modern choice
license = { text = "Proprietary" } # Placeholder for your current private status
authors = [
    { name = "Ilgar Baghishov", email = "baghishov@utexas.edu" },
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.0",
]

# Optional dependencies (e.g., for testing, development)
[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
]

# Optional: Links to homepage, repository, etc.
[project.urls]
# Homepage = "https://example.com" # Replace if you have one
Repository = "https://github.com/ilgarbaghishov/subdatapy" # Assuming this is your repo

# Optional: For configuring tools like pytest
# [tool.pytest.ini_options]
# pythonpath = ["."] # Add package root to pytest's pythonpath
# addopts = "--cov=subdatapy --cov-report=term-missing"