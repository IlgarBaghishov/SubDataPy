[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subdatapy"
version = "0.1.0"
description = "GPU-accelerated subsampling of large datasets for Machine Learning Interatomic Potentials (MLIPs)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ilgar Baghishov", email = "il.baghishov@gmail.com" },
]
keywords = [
    "subsampling",
    "mlip",
    "machine-learning-interatomic-potentials",
    "leverage-score",
    "cooks-distance",
    "data-selection",
    "pytorch",
    "gpu",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.8",
    "numpy>=1.20",
    "pandas>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
]
publish = [
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/IlgarBaghishov/SubDataPy"
Repository = "https://github.com/IlgarBaghishov/SubDataPy"
Issues = "https://github.com/IlgarBaghishov/SubDataPy/issues"

[tool.setuptools.packages.find]
include = ["subdatapy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
